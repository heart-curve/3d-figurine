<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Figurine Studio | 3D Interactive Showcase</title>

  <!-- Google Model Viewer Library -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0f1115;
      color: #e0e0e0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      height: 100vh;
      overflow: hidden;
      display: flex;
    }

    /* 3D Stage */
    #stage-container {
      flex: 1;
      position: relative;
      height: 100%;
    }

    model-viewer {
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at 50% 50%, #20242d 0%, #0d0f13 100%);
    }

    /* Control Panel (Glassmorphism look) */
    #ui-panel {
      position: absolute;
      top: 20px;
      right: 20px;
      width: 280px;
      background: rgba(22, 27, 34, 0.75);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }

    h2 {
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      color: #ffffff;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 8px;
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    label {
      font-size: 0.8rem;
      display: flex;
      justify-content: space-between;
      color: #a0a6b2;
    }

    input[type="range"] {
      width: 100%;
      accent-color: #3b82f6;
      cursor: pointer;
    }

    /* Preset Buttons */
    .button-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    button, .file-btn {
      background: #252d3a;
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 6px;
      padding: 8px 12px;
      font-size: 0.75rem;
      cursor: pointer;
      font-weight: 500;
      text-align: center;
      transition: background 0.2s;
    }

    button:hover, .file-btn:hover {
      background: #374151;
    }

    /* Model Loader Button */
    .file-btn {
      display: block;
      background: #2563eb;
      border: none;
    }
    .file-btn:hover {
      background: #1d4ed8;
    }

    #file-input {
      display: none;
    }

    /* Branding Badge */
    #badge {
      position: absolute;
      bottom: 20px;
      left: 20px;
      font-size: 0.85rem;
      color: #64748b;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <div id="stage-container">
    <!-- The Model Viewer Component -->
    <model-viewer
      id="studio-stage"
      src="https://modelviewer.dev/shared-assets/models/Astronaut.glb"
      ar
      ar-modes="webxr scene-viewer quick-look"
      camera-controls
      tone-mapping="neutral"
      shadow-intensity="1"
      shadow-softness="0.5"
      exposure="1.0"
      environment-image="neutral"
      alt="3D Figurine"
    ></model-viewer>

    <div id="badge">Studio Stage &bull; Rotate: Click + Drag &bull; Zoom: Scroll</div>
  </div>

  <!-- Real-Time Lighting UI Controls -->
  <div id="ui-panel">
    <h2>Lighting Studio</h2>

    <div class="control-group">
      <label>Exposure (Light Power) <span id="exposure-val">1.0</span></label>
      <input id="exposure-slider" type="range" min="0.2" max="2.5" step="0.1" value="1.0" />
    </div>

    <div class="control-group">
      <label>Shadow Intensity <span id="shadow-val">1.0</span></label>
      <input id="shadow-slider" type="range" min="0.0" max="2.0" step="0.1" value="1.0" />
    </div>

    <div class="control-group">
      <label>Light Angle</label>
      <input id="light-angle-slider" type="range" min="0" max="360" step="1" value="0" />
    </div>

    <h2>Mood Presets</h2>
    <div class="button-row">
      <button onclick="applyPreset('dramatic')">Moody Studio</button>
      <button onclick="applyPreset('bright')">Bright Exhibit</button>
    </div>

    <h2>Load Figurine</h2>
    <label for="file-input" class="file-btn">Choose Local .GLB File</label>
    <input type="file" id="file-input" accept=".glb,.gltf" />
  </div>

  <script>
    const stage = document.getElementById("studio-stage");
    const exposureSlider = document.getElementById("exposure-slider");
    const shadowSlider = document.getElementById("shadow-slider");
    const lightAngleSlider = document.getElementById("light-angle-slider");
    const fileInput = document.getElementById("file-input");

    // 1. Exposure Slider
    exposureSlider.addEventListener("input", (e) => {
      stage.exposure = e.target.value;
      document.getElementById("exposure-val").innerText = e.target.value;
    });

    // 2. Shadow Depth Slider
    shadowSlider.addEventListener("input", (e) => {
      stage.shadowIntensity = e.target.value;
      document.getElementById("shadow-val").innerText = e.target.value;
    });

    // 3. Environment Light Rotation Slider
    lightAngleSlider.addEventListener("input", (e) => {
      stage.orientation = `0deg 0deg ${e.target.value}deg`;
    });

    // 4. Studio Lighting Presets
    function applyPreset(mode) {
      if (mode === 'dramatic') {
        stage.exposure = 0.5;
        stage.shadowIntensity = 2.0;
        stage.shadowSoftness = 0.2;
        exposureSlider.value = 0.5;
        shadowSlider.value = 2.0;
      } else if (mode === 'bright') {
        stage.exposure = 1.6;
        stage.shadowIntensity = 0.4;
        stage.shadowSoftness = 1.0;
        exposureSlider.value = 1.6;
        shadowSlider.value = 0.4;
      }
      document.getElementById("exposure-val").innerText = stage.exposure;
      document.getElementById("shadow-val").innerText = stage.shadowIntensity;
    }

    // 5. On-Demand File Loader (Local .glb files)
    fileInput.addEventListener("change", (event) => {
      const file = event.target.files[0];
      if (file) {
        const fileURL = URL.createObjectURL(file);
        stage.src = fileURL;
      }
    });

    // 6. Drag-and-Drop anywhere on screen
    window.addEventListener("dragover", (e) => e.preventDefault());
    window.addEventListener("drop", (e) => {
      e.preventDefault();
      const file = e.dataTransfer.files[0];
      if (file && (file.name.endsWith(".glb") || file.name.endsWith(".gltf"))) {
        const fileURL = URL.createObjectURL(file);
        stage.src = fileURL;
      }
    });
  </script>
</body>
</html>
